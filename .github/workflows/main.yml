name: Universal Multi-threaded Build 9Router Binary (Linux)

on:
  push:
    branches:
      - 'master'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Universal Linux Binary
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Tambah Swap Space 8GB (Mencegah OOM saat Next.js Build & PKG)
      - name: Increase Swap Space
        run: |
          sudo swapoff /swapfile_extra 2>/dev/null || true
          sudo rm -f /swapfile_extra
          sudo fallocate -l 8G /swapfile_extra || sudo dd if=/dev/zero of=/swapfile_extra bs=1M count=8192
          sudo chmod 600 /swapfile_extra
          sudo mkswap /swapfile_extra
          sudo swapon /swapfile_extra
          echo "=== Memori & Swap Berhasil Ditambahkan ==="
          free -h

      # 2. Setup Node.js v20 (Disarankan untuk target node20 di pkg)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install Parallel Tools (pigz)
      - name: Install Parallel Tools (pigz)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pigz

      # 4. Install Dependencies & PKG Tool
      - name: Install Dependencies & PKG Tool
        run: |
          npm ci --prefer-offline --no-audit || npm install --prefer-offline
          npm install -g @yao-pkg/pkg --prefer-offline

      # 5. Build Next.js App
      - name: Build Next.js Standalone
        run: |
          CPU_CORES=$(nproc)
          export NODE_OPTIONS="--max-old-space-size=6144"
          export UV_THREADPOOL_SIZE=${CPU_CORES}
          export NEXT_TELEMETRY_DISABLED=1

          echo "Menjalankan 'npm run build'..."
          npm run build

      # 6. Siapkan Asset & Compile Standalone server.js ke Binary
      - name: Compile Standalone Server to Binary
        run: |
          mkdir -p dist

          # Pastikan folder standalone terbentuk dari next build
          if [ ! -f ".next/standalone/server.js" ]; then
            echo "::error:: File .next/standalone/server.js tidak ditemukan! Pastikan next.config.js memiliki output: 'standalone'."
            exit 1
          fi

          # Copy asset static ke folder standalone
          if [ -d "public" ]; then
            cp -r public .next/standalone/
          fi

          if [ -d ".next/static" ]; then
            mkdir -p .next/standalone/.next
            cp -r .next/static .next/standalone/.next/
          fi

          echo "Memulai kompilasi server.js ke binary Linux..."
          cd .next/standalone
          pkg server.js --targets node20-linux-x64 --output '../../dist/9router-linux'

      # 7. Paketkan Binary Beserta Asset Static
      - name: Package Binary & Static Assets
        run: |
          # Copy asset static pendukung ke dist
          if [ -d "public" ]; then cp -r public dist/; fi
          if [ -d ".next/static" ]; then
            mkdir -p dist/.next
            cp -r .next/static dist/.next/
          fi

          cd dist
          tar -I pigz -cf ../9router-linux.tar.gz 9router-linux public .next 2>/dev/null || tar -I pigz -cf ../9router-linux.tar.gz 9router-linux .next

      # 8. Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 9router-linux-binary
          path: 9router-linux.tar.gz
          compression-level: 0
          retention-days: 14
